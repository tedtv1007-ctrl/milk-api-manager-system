services:
  apisix:
    image: apache/apisix:3.11.0-debian
    restart: always
    environment:
      - APISIX_ETCD_HOST=http://etcd:2379
    volumes:
      - ./apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml:rw
      - ./apisix_conf/plugins/pii-masker.lua:/usr/local/apisix/apisix/plugins/pii-masker.lua:ro
      - ./apisix_conf/plugins/traffic-blocker.lua:/usr/local/apisix/apisix/plugins/traffic-blocker.lua:ro
    depends_on:
      - etcd
    ports:
      - "9080:9080"
      - "9091:9091"
      - "9443:9443"
      - "9180:9180"
    networks:
      - apisix

  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    restart: always
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    ports:
      - "2379:2379"
    networks:
      - apisix

  apisix-dashboard:
    image: apache/apisix-dashboard:3.0.1-alpine
    restart: always
    volumes:
      - ./dashboard_conf/conf.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    ports:
      - "9000:9000"
    networks:
      - apisix
    depends_on:
      - etcd

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: always
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks:
      - apisix

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - apisix

  grafana:
    image: grafana/grafana:11.5.2
    restart: always
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/audit.json:ro
    networks:
      - apisix

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    mem_limit: 1g
    networks:
      - apisix

  logstash:
    image: docker.elastic.co/logstash/logstash:9.2.3
    volumes:
      - ./monitoring/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"
      - "8082:8080"
      - "8081:8081"
    mem_limit: 1g
    depends_on:
      - elasticsearch
    networks:
      - apisix

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.3
    environment:
      - xpack.security.enabled=false
    ports:
      - "5601:5601"
    mem_limit: 1g
    depends_on:
      - elasticsearch
    networks:
      - apisix

  milk-db:
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-milk_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-milk_password}
      - POSTGRES_DB=${POSTGRES_DB:-milk_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-milk_user}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apisix

  milk-backend:
    build:
      context: ./backend/MilkApiManager
      dockerfile: Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=milk-db;Port=5432;Database=${POSTGRES_DB:-milk_db};Username=${POSTGRES_USER:-milk_user};Password=${POSTGRES_PASSWORD:-milk_password};SSL Mode=Disable;Maximum Pool Size=30;Minimum Pool Size=5;Connection Idle Lifetime=300
      - APISIX_ADMIN_URL=http://apisix:9180/apisix/admin
      - APISIX_ADMIN_KEY=${APISIX_ADMIN_KEY:-edd1c9f034335f136f87ad84b625c88b}
      - API_AUTH_KEY=${API_AUTH_KEY:-milk-admin-secret-key-change-me}
      - JWT_SECRET=${JWT_SECRET:-milk-api-default-jwt-secret-change-in-production-32chars!}
    ports:
      - "5001:8080"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - apisix
    depends_on:
      milk-db:
        condition: service_healthy
      apisix:
        condition: service_started

  milk-admin-ui:
    build:
      context: ./backend
      dockerfile: MilkAdminBlazor/Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - BackendApiUrl=http://milk-backend:8080
    ports:
      - "5000:8080"
    networks:
      - apisix
    depends_on:
      milk-backend:
        condition: service_healthy

networks:
  apisix:
    driver: bridge

volumes:
  postgres_data:
