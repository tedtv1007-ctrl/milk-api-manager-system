name: System Verification CI (Zeabur Friendly)

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Setup Environments
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js (for Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 1.5 Dependency Caching
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: e2e/node_modules
          key: node-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: node-

      # 1.6 Run Unit Tests (independent of Docker services)
      - name: Run .NET Unit Tests
        run: dotnet test backend/MilkApiManager.Tests/MilkApiManager.Tests.csproj --logger "trx;LogFileName=unit-results.trx" --results-directory ./test-results

      # 2. Infrastructure Setup (Lightweight Test Mode)
      - name: Start Services via Docker Compose (Test Mode)
        run: |
          docker compose -f docker-compose.test.yml up -d --build
          echo "Waiting for milk-backend healthcheck..."
          for i in {1..30}; do
            if curl -sf http://localhost:5001/health > /dev/null 2>&1; then
              echo "milk-backend is READY!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "milk-backend failed to start within 60s"
              docker compose -f docker-compose.test.yml logs
              exit 1
            fi
            echo "Waiting for milk-backend... ($i/30)"
            sleep 2
          done

      # 3. Execution: Unified Verification (The Source of Truth)
      - name: Run Full System Verification
        run: bash scripts/verify-all.sh
        env:
          BASE_URL: "http://localhost:5000"
          USE_TEST_MODE: "true"

      # 4. Final Status (Always run to upload artifacts)
      - name: Dump Docker Logs on Failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            e2e/test-report/
          retention-days: 14
