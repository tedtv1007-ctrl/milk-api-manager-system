apiVersion: 1

contactPoints:
  - orgId: 1
    name: milk-slo-webhook
    receivers:
      - uid: milk_slo_webhook_receiver
        type: webhook
        settings:
          url: ${GRAFANA_SLO_WEBHOOK_URL}
          httpMethod: POST
          maxAlerts: 0
          disableResolveMessage: false

policies:
  - orgId: 1
    receiver: milk-slo-webhook
    group_by:
      - alertname
      - grafana_folder
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: milk-slo-webhook
        object_matchers:
          - - alert_scope
            - =
            - slo
        continue: false
