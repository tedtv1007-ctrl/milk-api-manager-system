global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: 'apisix'
    metrics_path: '/apisix/prometheus/metrics'
    static_configs:
      - targets: ['apisix:9091']

  - job_name: 'milk-slo'
    metrics_path: '/metrics/slo'
    static_configs:
      - targets: ['milk-backend:8080']
